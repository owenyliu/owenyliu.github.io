<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readings – Owen Yajie Liu</title>
<meta name="description" content="Notes from papers Owen Yajie Liu has read.">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: #333; font-family: Helvetica, Arial, sans-serif; font-size: 18px; line-height: 1.4; }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  a { color: #4183c4; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .masthead { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; margin-bottom: 40px; border-bottom: 1px solid #eee; }
  .site-name { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 300; line-height: 1.7; }
  .site-name a { color: #333; }
  .site-name a:hover { text-decoration: none; }
  .site-description { margin: -5px 0 0; font-size: 16px; color: #666; }
  .back { font-size: 16px; }
  h1 { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 700; color: #222; margin: 0 0 10px; }
  .intro { margin: 0 0 20px; }
  .tags { margin: 0 0 30px; font-size: 16px; color: #999; }
  .tags button { background: none; border: 0; padding: 0; font: inherit; color: #999; cursor: pointer; }
  .tags button:hover { color: #4183c4; }
  .tags button.active { color: #222; font-weight: 700; }
  .year { font-size: 18px; font-weight: 700; color: #222; margin: 24px 0 6px; }
  .entry { display: grid; grid-template-columns: 60px 1fr; gap: 0 12px; padding: 3px 0; }
  .date { color: #999; font-variant-numeric: tabular-nums; }
  .title a { color: #333; font-weight: 700; }
  .title a:hover { color: #4183c4; text-decoration: none; }
  .meta { font-size: 15px; color: #888; }
  .meta a { color: #4183c4; }
  footer { margin: 50px 0 30px; padding-top: 15px; border-top: 1px solid #eee; font-size: 14px; color: #999; }
  @media (max-width: 640px) { body { font-size: 16px; } .entry { grid-template-columns: 50px 1fr; } }
</style>
</head>
<body>
<div class="container">

  <header class="masthead">
    <div>
      <h1 class="site-name"><a href="/">Owen Yajie Liu</a></h1>
      <p class="site-description">Stanford University</p>
    </div>
    <a class="back" href="/">← Home</a>
  </header>

  <main>
    <h1>Readings</h1>
    <p class="intro">Notes from papers I have read, mostly on AI agents, evaluation, and data.</p>
    <div class="tags" id="tags"></div>
    <div id="list"></div>
  </main>

  <footer>© <span id="yr"></span> Owen Yajie Liu</footer>
</div>

<script>
/*
  HOW TO ADD A READING
  Add one object to the top of READINGS:
    date:  "YYYY-MM-DD"  (the day you read it)
    title: paper title
    url:   link to the paper
    tags:  any labels you like; the filter buttons are built from these
    notes: (optional) link to your notes, e.g. "notes/react.html" or a Google Doc / Notion link
    note:  (optional) one-line takeaway shown under the title

  The entries below are STARTER EXAMPLES: replace the dates and add your own notes.
*/
const READINGS = [
  { date: "2026-11-10", title: "Terminal-Bench: Benchmarking agents on hard, realistic tasks in command line interfaces", url: "https://www.tbench.ai/", tags: ["Agents", "Benchmark"] },
  { date: "2026-11-03", title: "τ-bench: A Benchmark for Tool-Agent-User Interaction in Real-World Domains", url: "https://arxiv.org/abs/2406.12045", tags: ["Agents", "Benchmark"] },
  { date: "2026-10-27", title: "SWE-bench: Can Language Models Resolve Real-World GitHub Issues?", url: "https://arxiv.org/abs/2310.06770", tags: ["Agents", "Benchmark"] },
  { date: "2026-10-20", title: "OpenThoughts: Data Recipes for Reasoning Models", url: "https://arxiv.org/abs/2506.04178", tags: ["Data", "Reasoning"] },
  { date: "2025-10-12", title: "Reflexion: Language Agents with Verbal Reinforcement Learning", url: "https://arxiv.org/abs/2303.11366", tags: ["Agents"] },
  { date: "2025-10-05", title: "ReAct: Synergizing Reasoning and Acting in Language Models", url: "https://arxiv.org/abs/2210.03629", tags: ["Agents", "Reasoning"] },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const allTags = ["All", ...[...new Set(READINGS.flatMap(r => r.tags || []))].sort()];
let current = "All";

function renderTags() {
  document.getElementById("tags").innerHTML = allTags
    .map(t => `<button class="${t === current ? "active" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`)
    .join(" · ");
  document.querySelectorAll("#tags button").forEach(b =>
    b.addEventListener("click", () => { current = b.dataset.tag; renderTags(); renderList(); }));
}

function renderList() {
  const items = READINGS
    .filter(r => current === "All" || (r.tags || []).includes(current))
    .sort((a, b) => b.date.localeCompare(a.date));
  let html = "", lastYear = "";
  for (const r of items) {
    const [y, m, d] = r.date.split("-");
    if (y !== lastYear) { html += `<div class="year">${y}</div>`; lastYear = y; }
    const extra = [];
    if (r.note) extra.push(esc(r.note));
    if (r.notes) extra.push(`<a href="${esc(r.notes)}">notes</a>`);
    html += `<div class="entry"><span class="date">${m}-${d}</span><span class="title"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>${extra.length ? `<div class="meta">${extra.join(" | ")}</div>` : ""}</span></div>`;
  }
  document.getElementById("list").innerHTML = html || "<p>No readings yet.</p>";
}

document.getElementById("yr").textContent = new Date().getFullYear();
renderTags(); renderList();
</script>
</body>
</html>
